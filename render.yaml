services:
  - type: web
    name: learnmesh
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: DATABASE_URL
        sync: false
      - key: MANUS_PROJECT_ID
        sync: false
      - key: MANUS_JWT_SECRET
        sync: false
      - key: MANUS_OAUTH_API_URL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: MANUS_API_URL
        sync: false
      - key: MANUS_API_KEY
        sync: false
